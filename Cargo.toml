[package]
name = "rust_search"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
tokio-postgres = "0.7"
pgvector = { version = "0.3", features = ["postgres"] }

# ✅ Connection pool (FIXED)
bb8 = "0.8"
bb8-postgres = "0.8"

# Env
dotenv = "0.15"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["chrono", "env-filter"] }

# ✅ Error handling (FIXED)
thiserror = "1"

# ✅ Middleware (TraceLayer)
tower-http = { version = "0.5", features = ["trace"] }